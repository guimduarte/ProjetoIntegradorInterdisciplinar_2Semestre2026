name: maos_solidarias
description: App que conecta profissionais de manutenção e reforma a servicos solidarios para entidades publicas e ONGs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  amplify_flutter: ^2.11.0
  amplify_auth_cognito: ^2.11.0
  amplify_api: ^2.11.0
  amplify_storage_s3: ^2.11.0
  file_picker: ^8.1.2
  mask_text_input_formatter: ^2.5.0
  http: ^1.6.0
  geocoding: ^5.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - amplify_outputs.json
